kind = "web"
previewPath = "/"
title = "RefugeeID Platform"
version = "1.0.0"
id = "artifacts/refugeeid"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21856

[services.development]
run = "pnpm --filter @workspace/refugeeid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/refugeeid", "run", "build" ]
publicDir = "artifacts/refugeeid/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21856"
BASE_PATH = "/"
